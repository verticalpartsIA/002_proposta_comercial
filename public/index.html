    <!-- SSO bootstrap: carrega o React apenas após resolver autenticação -->
    <script>
    (function () {
      function loadApp() {
        var s = document.createElement('script');
        s.type = 'module';
        s.crossOrigin = '';
        s.src = '/assets/index-BafzBFi2.js';
        document.head.appendChild(s);
      }

      function clearSession() {
        localStorage.removeItem('token');
        localStorage.removeItem('auth_user');
      }

      var p = new URLSearchParams(window.location.search);
      var sso = p.get('sso_token');

      if (sso) {
        console.log('[SSO] token recebido, trocando...');
        window.history.replaceState({}, '', window.location.pathname);
        fetch('/api/auth_sso.php?sso_token=' + encodeURIComponent(sso))
          .then(function (r) {
            console.log('[SSO] auth_sso.php status:', r.status);
            return r.json();
          })
          .then(function (d) {
            console.log('[SSO] resposta:', JSON.stringify(d));
            if (d.token) {
              localStorage.setItem('token', d.token);
              if (d.user) localStorage.setItem('auth_user', JSON.stringify(d.user));
              console.log('[SSO] auth_user salvo:', localStorage.getItem('auth_user'));
              loadApp();
            } else {
              console.warn('[SSO] falhou, redirecionando para vpsistema.com');
              clearSession();
              window.location.replace('https://vpsistema.com');
            }
          })
          .catch(function (err) {
            console.error('[SSO] erro de rede:', err);
            clearSession();
            window.location.replace('https://vpsistema.com');
          });
        return;
      }

      var token = localStorage.getItem('token');
      if (!token) {
        window.location.replace('https://vpsistema.com');
        return;
      }

      // Tem token salvo → validar com o servidor antes de carregar o React
      fetch('/api/auth_ping.php', {
        headers: { 'Authorization': 'Bearer ' + token }
      })
        .then(function (r) {
          if (r.ok) {
            loadApp();
          } else {
            clearSession();
            window.location.replace('https://vpsistema.com');
          }
        })
        .catch(function () {
          // Falha de rede — carrega mesmo assim para não bloquear
          loadApp();
        });
    })();
    </script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
