<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Solicitações</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
        }
      }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';

      // ========== Config da API ==========
      const API = 'https://cyan-partridge-132677.hostingersite.com/api/api.php';

      // Helpers API
      const authHeaders = () => {
        const cu = JSON.parse(localStorage.getItem('currentUser') || 'null');
        return cu?.token ? { 'Authorization': `Bearer ${cu.token}` } : {};
      };
      const dataUrlToFile = async (dataUrl, filename='anexo.jpg') => {
        const res = await fetch(dataUrl);
        const blob = await res.blob();
        return new File([blob], filename, { type: blob.type || 'application/octet-stream' });
      };
      const apiLogin = async (username, password) => {
        const r = await fetch(`${API}?action=login`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username, password })
        });
        if(!r.ok) return null;
        return r.json();
      };
      const apiCreateRequest = async (payload) => {
        const fd = new FormData();
        fd.append('type', payload.type);
        fd.append('details', JSON.stringify(payload.formData));
        if (payload.file) { fd.append('main_file', payload.file, payload.file.name || 'anexo'); }
        const r = await fetch(`${API}?action=create_request`, { method:'POST', headers: authHeaders(), body: fd });
        if(!r.ok) throw new Error('Falha ao criar solicitação');
        return r.json();
      };
      const apiListRequests = async () => {
        const r = await fetch(`${API}?action=list_requests`, { headers: authHeaders() });
        if(!r.ok) throw new Error('Falha ao listar solicitações');
        return r.json();
      };
      const apiUpdateRequestStatus = async (id, status) => {
        const r = await fetch(`${API}?action=update_status`, {
          method:'POST',
          headers: { 'Content-Type':'application/json', ...authHeaders() },
          body: JSON.stringify({ id, status })
        });
        if(!r.ok) throw new Error('Falha ao atualizar status');
        return r.json();
      };
      const apiDeleteRequest = async (id) => {
        const r = await fetch(`${API}?action=delete_request`, {
          method:'POST',
          headers: { 'Content-Type':'application/json', ...authHeaders() },
          body: JSON.stringify({ id })
        });
        if(!r.ok) throw new Error('Erro ao remover solicitação');
        return r.json();
      };
       const apiUpdateRequestDetails = async (id, details) => {
        const r = await fetch(`${API}?action=update_details`, {
          method:'POST',
          headers: { 'Content-Type':'application/json', ...authHeaders() },
          body: JSON.stringify({ id, details })
        });
        if(!r.ok) throw new Error('Falha ao atualizar detalhes da solicitação');
        return r.json();
      };
      const apiAddUser = async ({username, password, role}) => {
        const r = await fetch(`${API}?action=add_user`, {
          method:'POST',
          headers: { 'Content-Type':'application/json', ...authHeaders() },
          body: JSON.stringify({ username, password, role })
        });
        if(!r.ok) throw new Error('Erro ao criar usuário');
        return r.json();
      };
      const apiListUsers = async () => {
        const r = await fetch(`${API}?action=list_users`, { headers: authHeaders() });
        if(!r.ok) throw new Error('Erro ao listar usuários');
        return r.json();
      };
      const apiDeleteUser = async (username) => {
        const r = await fetch(`${API}?action=delete_user&username=${encodeURIComponent(username)}`, {
          method:'DELETE',
          headers: authHeaders()
        });
        if(!r.ok) throw new Error('Erro ao remover usuário');
        return r.json();
      };

      // --- COMMON COMPONENTS ---

      const FormSection = ({ title, children }) => {
        return (
          <section className="py-6 border-t border-gray-200 first:border-t-0 first:pt-0">
            <h2 className="text-lg font-semibold text-gray-900 mb-4">{title}</h2>
            <div className="grid grid-cols-1 gap-x-6 gap-y-6 sm:grid-cols-6">
              {children}
            </div>
          </section>
        );
      };

      const InputField = ({
        label,
        id,
        name,
        type = 'text',
        value,
        onChange,
        placeholder,
        required = false,
        className = 'sm:col-span-3'
      }) => {
        return (
          <div className={className}>
            <label htmlFor={id} className="block text-sm font-medium leading-6 text-gray-900">
              {label}
            </label>
            <div className="mt-2">
              <input
                type={type}
                name={name}
                id={id}
                value={value}
                onChange={onChange}
                placeholder={placeholder}
                required={required}
                className="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-yellow-400 sm:text-sm sm:leading-6"
              />
            </div>
          </div>
        );
      };

      const TextAreaField = ({
        label,
        id,
        name,
        value,
        onChange,
        placeholder,
        rows = 3,
        required = false,
        className = 'sm:col-span-full'
      }) => {
        return (
          <div className={className}>
            <label htmlFor={id} className="block text-sm font-medium leading-6 text-gray-900">
              {label}
            </label>
            <div className="mt-2">
              <textarea
                id={id}
                name={name}
                rows={rows}
                value={value}
                onChange={onChange}
                placeholder={placeholder}
                required={required}
                className="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-yellow-400 sm:text-sm sm:leading-6"
              />
            </div>
          </div>
        );
      };
      
      const FileInput = ({
        label,
        id,
        name,
        onChange,
        helpText,
        className = 'sm:col-span-3',
        ...props
      }) => {
        const [fileName, setFileName] = useState('');

        const handleFileChange = (e) => {
          if (e.target.files && e.target.files.length > 0) {
            setFileName(e.target.files[0].name);
          } else {
            setFileName('');
          }
          onChange(e);
        };

        useEffect(() => {
            setFileName('');
        }, [props.key]);

        return (
          <div className={className}>
            <label htmlFor={id} className="block text-sm font-medium leading-6 text-gray-900">
              {label}
            </label>
            <div className="mt-2 flex items-center justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-6">
              <div className="text-center">
                <svg className="mx-auto h-10 w-10 text-gray-300" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path fillRule="evenodd" d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0 00-2.12 0l-.88.879.97.97a.75.75 0 11-1.06 1.06l-5.16-5.159a1.5 1.5 0 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0 112.25 0 1.125 1.125 0 01-2.25 0z" clipRule="evenodd" />
                </svg>
                <div className="mt-4 flex text-sm leading-6 text-gray-600">
                  <label
                    htmlFor={id}
                    className="relative cursor-pointer rounded-md bg-white font-semibold text-yellow-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-yellow-400 focus-within:ring-offset-2 hover:text-yellow-600"
                  >
                    <span>Selecione um arquivo</span>
                    <input id={id} name={name} type="file" className="sr-only" onChange={handleFileChange} />
                  </label>
                  <p className="pl-1">ou arraste e solte</p>
                </div>
                {fileName && <p className="text-xs leading-5 text-gray-500 mt-2">{fileName}</p>}
                {helpText && <p className="text-xs leading-5 text-gray-600">{helpText}</p>}
              </div>
            </div>
          </div>
        );
      };
      
      const SelectField = ({
        label,
        id,
        name,
        value,
        onChange,
        children,
        required = false,
        className = 'sm:col-span-3',
      }) => {
        return (
          <div className={className}>
            <label htmlFor={id} className="block text-sm font-medium leading-6 text-gray-900">
              {label}
            </label>
            <div className="mt-2">
              <select
                id={id}
                name={name}
                value={value}
                onChange={onChange}
                required={required}
                className="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-yellow-400 sm:max-w-xs sm:text-sm sm:leading-6"
              >
                {children}
              </select>
            </div>
          </div>
        );
      };

      const CheckboxField = ({
        label,
        id,
        name,
        checked,
        onChange,
        description,
        type = 'checkbox',
      }) => {
        return (
          <div className="relative flex gap-x-3">
            <div className="flex h-6 items-center">
              <input
                id={id}
                name={name}
                type={type}
                checked={checked}
                onChange={onChange}
                className="h-4 w-4 rounded border-gray-300 text-yellow-400 focus:ring-yellow-400"
              />
            </div>
            <div className="text-sm leading-6">
              <label htmlFor={id} className="font-medium text-gray-900">
                {label}
              </label>
              {description && <p className="text-gray-500">{description}</p>}
            </div>
          </div>
        );
      };

      // --- DASHBOARD COMPONENTS ---
      const ChartCard = ({ title, children }) => (
        <div className="bg-white p-6 rounded-lg border border-gray-200 shadow-sm flex flex-col">
          <h3 className="text-lg font-semibold text-gray-800 mb-4 flex-shrink-0">{title}</h3>
          <div className="flex-grow flex items-center justify-center">
              {children}
          </div>
        </div>
      );

      const HorizontalBarChart = ({ data, color = 'bg-yellow-400' }) => {
        if (!data || data.length === 0) {
          return <p className="text-sm text-gray-500">Sem dados para exibir.</p>;
        }
        const maxValue = Math.max(...data.map(item => item.value), 0);
        return (
          <div className="w-full h-full space-y-3 flex flex-col justify-center">
            {data.map((item, index) => (
              <div key={index} className="flex items-center gap-x-3">
                <span className="text-sm text-gray-600 w-28 truncate text-right" title={item.label}>{item.label}</span>
                <div className="flex-1 bg-gray-200 rounded-full h-5">
                  <div
                    className={`${color} h-5 rounded-full flex items-center justify-end pr-2 text-xs font-medium text-gray-800`}
                    style={{ width: `${maxValue > 0 ? (item.value / maxValue) * 100 : 0}%` }}
                  >
                    {item.value}
                  </div>
                </div>
              </div>
            ))}
          </div>
        );
      };

      const VerticalBarChart = ({ data, color = 'bg-yellow-400' }) => {
        if (!data || data.every(item => item.value === 0)) {
          return <p className="text-sm text-gray-500">Sem dados para exibir.</p>;
        }
        const maxValue = Math.max(...data.map(item => item.value), 1);
        return (
          <div className="w-full h-full flex items-end justify-around gap-x-2 pt-4">
            {data.map((item, index) => (
              <div key={index} className="flex flex-col items-center justify-end h-full w-8">
                <div className="text-xs font-semibold text-gray-700 mb-1">{item.value}</div>
                <div className="w-full flex-1 flex items-end">
                  <div
                    className={`${color} w-full rounded-t-md hover:opacity-80 transition-opacity`}
                    style={{ height: `${(item.value / maxValue) * 100}%` }}
                    title={`${item.label}: ${item.value}`}
                  />
                </div>
                <span className="text-xs text-gray-500 mt-1">{item.label}</span>
              </div>
            ))}
          </div>
        );
      };

      const StatusDonutChart = ({ data, total }) => {
          const radius = 50;
          const circumference = 2 * Math.PI * radius;
          let accumulatedAngle = 0;

          const segments = data.map(item => {
              const percentage = total > 0 ? (item.value / total) * 100 : 0;
              const dash = (percentage / 100) * circumference;
              const rotation = accumulatedAngle - 90;
              accumulatedAngle += (percentage / 100) * 360;
              return { ...item, dash, rotation };
          });
          
          return (
              <div className="flex flex-col lg:flex-row items-center justify-center gap-x-12 gap-y-8 w-full">
                  <div className="relative w-48 h-48 flex-shrink-0">
                      <svg className="w-full h-full" viewBox="0 0 120 120">
                          <circle cx="60" cy="60" r={radius} fill="transparent" strokeWidth="20" className="stroke-gray-200" />
                          {segments.map((segment, index) => (
                             segment.value > 0 && <circle
                                  key={index}
                                  cx="60"
                                  cy="60"
                                  r={radius}
                                  fill="transparent"
                                  strokeWidth="20"
                                  className={segment.color}
                                  strokeDasharray={`${segment.dash} ${circumference}`}
                                  transform={`rotate(${segment.rotation} 60 60)`}
                              />
                          ))}
                           <g className="transform transition-transform duration-300 hover:scale-110">
                              <text x="50%" y="50%" textAnchor="middle" dy=".3em" className="text-3xl font-bold fill-current text-gray-800">
                                  {total}
                              </text>
                              <text x="50%" y="50%" textAnchor="middle" dy="1.8em" className="text-xs font-medium fill-current text-gray-500">
                                  Total
                              </text>
                          </g>
                      </svg>
                  </div>
                  <div className="w-full max-w-xs space-y-3">
                       {data.map(item => (
                          <div className="flex items-center" key={item.name}>
                              <span className={`w-3 h-3 rounded-full mr-3 ${item.bgColor}`}></span>
                              <div className="flex justify-between w-full text-sm">
                                  <span className="text-gray-700">{item.name}</span>
                                  <span className="font-semibold text-gray-900">{item.value}</span>
                              </div>
                          </div>
                      ))}
                  </div>
              </div>
          );
      };

      // --- FEATURE COMPONENTS ---
      
      const Dashboard = ({ requests, currentUser }) => {
          const relevantRequests = currentUser.role === 'admin'
              ? requests
              : requests.filter(req => req.submittedBy === currentUser.username);

          const total = relevantRequests.length;

          if (total === 0) {
            return (
              <div className="flex flex-col items-center justify-center p-12 text-center text-gray-500">
                <svg className="w-16 h-16 mx-auto text-gray-300" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V7a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <h3 className="mt-4 text-lg font-medium text-gray-900">Sem dados para exibir</h3>
                <p className="mt-1 text-sm">Ainda não há solicitações para gerar o dashboard.</p>
              </div>
            );
          }

          // Status Data
          const approved = relevantRequests.filter(r => r.status === 'Aprovado').length;
          const pending = relevantRequests.filter(r => r.status === 'Pendente').length;
          const rejected = relevantRequests.filter(r => r.status === 'Reprovado').length;
          const statusData = [
              { name: 'Aprovadas', value: approved, color: 'stroke-green-500', bgColor: 'bg-green-500' },
              { name: 'Reprovadas', value: rejected, color: 'stroke-red-500', bgColor: 'bg-red-500' },
              { name: 'Aguardando', value: pending, color: 'stroke-yellow-500', bgColor: 'bg-yellow-500' },
          ];

          // Hotel Data
          const topHotels = Object.entries(relevantRequests
              .filter(req => req.type === 'Viagem' && req.formData.hotel)
              .reduce((acc, req) => {
                  const hotel = req.formData.hotel.trim();
                  if (hotel) acc[hotel] = (acc[hotel] || 0) + 1;
                  return acc;
              }, {}))
              .sort(([, a], [, b]) => b - a).slice(0, 5).map(([label, value]) => ({ label, value }));

          // Shipper Data
          const topShippers = Object.entries(relevantRequests
              .filter(req => (req.type === 'Munck' || req.type === 'Andaime') && req.formData.transportadora)
              .reduce((acc, req) => {
                  const shipper = req.formData.transportadora.trim();
                  if (shipper) acc[shipper] = (acc[shipper] || 0) + 1;
                  return acc;
              }, {}))
              .sort(([, a], [, b]) => b - a).slice(0, 5).map(([label, value]) => ({ label, value }));

          // Monthly Requests Data
          const requestsByMonth = Array(12).fill(0).map((_, i) => ({
              label: new Date(0, i).toLocaleString('pt-BR', { month: 'short' }).replace('.', ''),
              value: 0
          }));
          relevantRequests.forEach(req => {
              const month = new Date(req.submittedAt).getMonth();
              requestsByMonth[month].value++;
          });
          
          // Payment Method Data
          const topPaymentMethods = Object.entries(relevantRequests
              .filter(req => req.formData.meioPagamento)
              .reduce((acc, req) => {
                  const method = req.formData.meioPagamento.trim();
                  if (method) acc[method] = (acc[method] || 0) + 1;
                  return acc;
              }, {}))
              .sort(([, a], [, b]) => b - a).slice(0, 5).map(([label, value]) => ({ label, value }));

          return (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="lg:col-span-2">
                    <ChartCard title="Status das Solicitações">
                        <StatusDonutChart data={statusData} total={total} />
                    </ChartCard>
                </div>
                <ChartCard title="Solicitações por Mês">
                    <VerticalBarChart data={requestsByMonth} color="bg-blue-400" />
                </ChartCard>
                <ChartCard title="Top 5 Hotéis Utilizados">
                    <HorizontalBarChart data={topHotels} color="bg-green-400" />
                </ChartCard>
                 <ChartCard title="Top 5 Transportadoras">
                    <HorizontalBarChart data={topShippers} color="bg-indigo-400" />
                </ChartCard>
                <ChartCard title="Top 5 Meios de Pagamento">
                    <HorizontalBarChart data={topPaymentMethods} color="bg-pink-400" />
                </ChartCard>
            </div>
          );
      };

      const TravelRequestForm = ({ onAddRequest }) => {
          const initialFormData = {
              departamento: '', centroCusto: '', cliente: '', endereco: '', complemento: '',
              bairro: '', cidade: '', uf: '', cep: '', objetivo: '',
              nomeCompleto: '', rg: '', cpf: '', dataNascimento: '', celularEmpresa: '', email: '',
              origem: '', destino: '', dataIda: '', dataVolta: '', observacoesViagem: '',
              locacaoVeiculo: false, tipoLocacao: '', tipoVeiculo: '', obsVeiculo: '',
              necessitaHospedagem: false, periodoHospedagem: '', obsHospedagem: ''
          };

          const [formData, setFormData] = useState(initialFormData);
          const [fileData, setFileData] = useState(null);
          const [fileInputKey, setFileInputKey] = useState(Date.now());
          const [formStatus, setFormStatus] = useState(null);

          const handleChange = (e) => {
              const { name, value, type, checked } = e.target;
              setFormData(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
          };

          const handleFileChange = (e) => {
              if (e.target.files && e.target.files[0]) {
                  const file = e.target.files[0];
                  const reader = new FileReader();
                  reader.onload = (loadEvent) => {
                      if (loadEvent.target && typeof loadEvent.target.result === 'string') {
                          setFileData({ name: file.name, dataUrl: loadEvent.target.result });
                      }
                  };
                  reader.readAsDataURL(file);
              } else {
                  setFileData(null);
              }
          };

          const handleSubmit = async (e) => {
              e.preventDefault();
              try {
                await onAddRequest({
                    type: 'Viagem',
                    formData: formData,
                    documentPhoto: fileData,
                });
                setFormStatus({ message: 'Solicitação de viagem enviada com sucesso!', type: 'success' });
                setFormData(initialFormData);
                setFileData(null);
                setFileInputKey(Date.now());
                setTimeout(() => setFormStatus(null), 5000);
              } catch (err) {
                 setFormStatus({ message: err.message || 'Erro ao enviar solicitação.', type: 'error' });
              }
          };

          return (
              <form onSubmit={handleSubmit}>
                  <div className="space-y-6">
                      <FormSection title="Dados da Empresa">
                          <InputField label="Departamento" id="departamento" name="departamento" value={formData.departamento} onChange={handleChange} required />
                          <InputField label="Centro Custo/Projeto" id="centroCusto" name="centroCusto" value={formData.centroCusto} onChange={handleChange} required />
                          <InputField label="Cliente" id="cliente" name="cliente" value={formData.cliente} onChange={handleChange} required />
                          <InputField label="Endereço" id="endereco" name="endereco" value={formData.endereco} onChange={handleChange} required className="sm:col-span-4" />
                          <InputField label="Complemento" id="complemento" name="complemento" value={formData.complemento} onChange={handleChange} required className="sm:col-span-2" />
                          <InputField label="Bairro" id="bairro" name="bairro" value={formData.bairro} onChange={handleChange} required />
                          <InputField label="Cidade" id="cidade" name="cidade" value={formData.cidade} onChange={handleChange} required />
                          <InputField label="UF" id="uf" name="uf" value={formData.uf} onChange={handleChange} required className="sm:col-span-1" />
                          <InputField label="CEP" id="cep" name="cep" value={formData.cep} onChange={handleChange} required className="sm:col-span-2" />
                          <TextAreaField label="Objetivo" id="objetivo" name="objetivo" value={formData.objetivo} onChange={handleChange} required />
                      </FormSection>

                      <FormSection title="Dados do Passageiro">
                          <InputField label="Nome Completo" id="nomeCompleto" name="nomeCompleto" value={formData.nomeCompleto} onChange={handleChange} required className="sm:col-span-4" />
                          <InputField label="RG" id="rg" name="rg" value={formData.rg} onChange={handleChange} required />
                          <InputField label="CPF" id="cpf" name="cpf" value={formData.cpf} onChange={handleChange} required />
                          <InputField label="Data de Nascimento" id="dataNascimento" name="dataNascimento" type="date" value={formData.dataNascimento} onChange={handleChange} required />
                          <InputField label="Celular da Empresa" id="celularEmpresa" name="celularEmpresa" value={formData.celularEmpresa} onChange={handleChange} required />
                          <InputField label="Email" id="email" name="email" type="email" value={formData.email} onChange={handleChange} required />

              <div className="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50" role="dialog" aria-modal="true">
                  <div className="relative bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
                      <header className="flex items-center justify-between p-4 border-b">
                          <h2 className="text-xl font-bold text-gray-800">Detalhes da Solicitação de {request.type}</h2>
                          <button onClick={onClose} className="text-gray-400 hover:text-gray-600" aria-label="Fechar">
                              <svg className="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                          </button>
                      </header>
                      <div className="p-6 overflow-y-auto">
                          <div className="space-y-4">
                              {details.map(([key, value]) => (
                                  <div key={key} className="grid grid-cols-3 gap-4 text-sm">
                                      <dt className="font-semibold text-gray-600 col-span-1">{formatLabel(key)}</dt>
                                      <dd className="text-gray-800 col-span-2">{formatValue(key, value)}</dd>
                                  </div>
                              ))}
                          </div>

                          {canBeEdited && (
                              <div className="mt-6 pt-6 border-t">
                                  <h3 className="text-lg font-semibold text-gray-900 mb-4">Dados Adicionais (Admin)</h3>
                                  <div className="grid grid-cols-1 gap-y-6">
                                      {request.type === 'Viagem' && (
                                        <>
                                          <InputField label="Hotel" id="hotel" name="hotel" value={adminData.hotel} onChange={handleAdminDataChange} className="sm:col-span-full" />
                                          <InputField label="Local" id="local" name="local" value={adminData.local} onChange={handleAdminDataChange} className="sm:col-span-full" />
                                          <InputField label="Meio de Pagamento" id="meioPagamento" name="meioPagamento" value={adminData.meioPagamento} onChange={handleAdminDataChange} className="sm:col-span-full" />
                                        </>
                                      )}
                                      {(request.type === 'Munck' || request.type === 'Andaime') && (
                                         <>
                                          <InputField label="Transportadora" id="transportadora" name="transportadora" value={adminData.transportadora} onChange={handleAdminDataChange} className="sm:col-span-full" />
                                          <InputField label="Meio de Pagamento" id="meioPagamento" name="meioPagamento" value={adminData.meioPagamento} onChange={handleAdminDataChange} className="sm:col-span-full" />
                                        </>
                                      )}
                                  </div>
                              </div>
                          )}
                      </div>
                      <footer className="flex justify-end p-4 border-t bg-gray-50 rounded-b-lg gap-x-4">
                          {canBeEdited ? (
                              <>
                                  <button onClick={onClose} className="inline-flex justify-center rounded-md bg-white py-2 px-4 text-sm font-medium text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50">
                                      Cancelar
                                  </button>
                                  <button onClick={handleSave} className="inline-flex justify-center rounded-md bg-yellow-400 py-2 px-4 text-sm font-medium text-gray-900 hover:bg-yellow-500 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:ring-offset-2">
                                      Salvar Alterações
                                  </button>
                              </>
                          ) : (
                              <button onClick={onClose} className="inline-flex justify-center rounded-md bg-yellow-400 py-2 px-4 text-sm font-medium text-gray-900 hover:bg-yellow-500 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:ring-offset-2">
                                  Fechar
                              </button>
                          )}
                      </footer>
                  </div>
              </div>
          );
      };

      // --- MAIN APP COMPONENT ---

      const App = () => {
        const [currentUser, setCurrentUser] = useState(null);
        const [users, setUsers] = useState([]);
        const [requests, setRequests] = useState([]);
        const [activeView, setActiveView] = useState('dashboard');
        const [selectedRequest, setSelectedRequest] = useState(null);
        const [isModalOpen, setIsModalOpen] = useState(false);
        const [loading, setLoading] = useState(true);
        const [error, setError] = useState('');

        useEffect(() => {
          const storedUser = localStorage.getItem('currentUser');
          if (storedUser) {
              const user = JSON.parse(storedUser);
              setCurrentUser(user);
              if (user.role !== 'admin') {
                  setActiveView('myRequests');
              }
          } else {
              setLoading(false);
          }
        }, []);
        
        useEffect(() => {
          if (currentUser) {
            reloadAll();
          }
        }, [currentUser]);

        const reloadAll = async () => {
          try {
            setLoading(true);
            setError('');
            await Promise.all([reloadRequests(), reloadUsers()]);
          } catch (e) {
            setError(e.message || 'Falha ao carregar dados do servidor.');
            if (e.message.toLowerCase().includes('authentication') || e.message.toLowerCase().includes('token')) {
                handleLogout();
            }
          } finally {
            setLoading(false);
          }
        };

        const reloadRequests = async () => {
          try {
            const data = await apiListRequests();
            const mapped = (data.requests || []).map((it) => ({
                id: it.id, type: it.type, status: it.status,
                submittedAt: it.submitted_at, submittedBy: it.username,
                formData: (() => { try { return JSON.parse(it.details || '{}'); } catch { return {}; } })(),
                attachmentUrl: it.main_file_path || null,
            }));
            setRequests(mapped);
          } catch (e) {
             setRequests([]);
             throw e;
          }
        };

        const reloadUsers = async () => {
          if (currentUser?.role !== 'admin') {
              setUsers([]);
              return;
          }
          try {
              const data = await apiListUsers();
              if (Array.isArray(data?.users)) {
                setUsers(data.users);
              } else {
                console.warn("API response for users is not an array:", data);
                setUsers([]);
              }
          } catch (e) {
              console.error("Failed to reload users:", e);
              setUsers([]);
              throw e;
          }
        };

        const handleLogin = async (username, password) => {
          try {
            const data = await apiLogin(username, password);
            if (!data?.token) return false;
            const user = { username: data.username, role: data.role, token: data.token };
            localStorage.setItem('currentUser', JSON.stringify(user));
            setCurrentUser(user);
            setActiveView(user.role === 'admin' ? 'dashboard' : 'myRequests');
            return true;
          } catch (e) {
            return false;
          }
        };
        
        const handleLogout = () => {
          localStorage.removeItem('currentUser');
          setCurrentUser(null);
          setUsers([]);
          setRequests([]);
        };

        const addRequest = async (request) => {
          const { type, formData, documentPhoto, localPhoto } = request;
          const fileData = documentPhoto || localPhoto;
          let file = null;
          if (fileData?.dataUrl) {
              file = await dataUrlToFile(fileData.dataUrl, fileData.name || 'anexo.jpg');
          }
          await apiCreateRequest({ type, formData, file });
          await reloadRequests();
          setActiveView('myRequests');
        };

        const updateRequestStatus = async (id, status) => {
            try {
                await apiUpdateRequestStatus(id, status);
                await reloadRequests();
            } catch(e) {
                alert('Falha ao atualizar status: ' + e.message);
            }
        };

        const removeRequest = async (id) => {
            if (window.confirm('Tem certeza que deseja excluir esta solicitação? Esta ação não pode ser desfeita.')) {
                try {
                    await apiDeleteRequest(id);
                    await reloadRequests();
                } catch(e) {
                    alert('Falha ao remover solicitação: ' + e.message);
                }
            }
        };

        const updateRequestDetails = async (id, details) => {
            try {
                await apiUpdateRequestDetails(id, details);
                // Atualiza o estado localmente para refletir a mudança imediatamente.
                setRequests(prevRequests =>
                    prevRequests.map(req =>
                        req.id === id ? { ...req, formData: details } : req
                    )
                );
                handleCloseDetails();
            } catch(e) {
                alert('Falha ao salvar detalhes: ' + e.message);
                // Em caso de falha, recarrega do servidor para garantir consistência.
                reloadRequests();
            }
        };
        
        const addUser = async (user) => {
            await apiAddUser(user);
        };

        const removeUser = async (username) => {
            if (username === currentUser?.username) {
                alert('Você não pode remover a si mesmo.');
                return;
            }
            if(window.confirm(`Tem certeza que deseja remover o usuário '${username}'?`)) {
              try {
                  await apiDeleteUser(username);
                  await reloadUsers();
              } catch (e) {
                  alert('Falha ao remover usuário: ' + e.message);
              }
            }
        };

        const handleShowDetails = (request) => {
          setSelectedRequest(request);
          setIsModalOpen(true);
        };

        const handleCloseDetails = () => {
          setIsModalOpen(false);
          setSelectedRequest(null);
        };

        if (loading && !currentUser) {
            return <div className="flex h-screen items-center justify-center"><p>Carregando...</p></div>;
        }

        if (!currentUser) {
          return <Login onLogin={handleLogin} />;
        }

        const icons = {
          dashboard: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z" /><path d="M12 2.252A8.014 8.014 0 0117.748 8H12V2.252z" /></svg>,
          travel: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 1 1 0 000-2z" clipRule="evenodd" /></svg>,
          munck: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.972.246 2.159-.948 2.286-1.56.38-1.56 2.6 0 2.98.972.54 2.159.246 2.286-.948.836-1.372 2.734-2.942 2.106-2.106a1.532 1.532 0 01.948 2.286c.38 1.56 2.6 1.56 2.98 0a1.532 1.532 0 012.286-.948c1.372.836 2.942-.734 2.106-2.106a1.532 1.532 0 01-.948-2.286c-1.56-.38-1.56-2.6 0-2.98a1.532 1.532 0 01.948-2.286c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.286-.948zM10 13a3 3 0 100-6 3 3 0 000 6z" /></svg>,
          scaffold: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M2 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1H3a1 1 0 01-1-1V4zM8 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1H9a1 1 0 01-1-1V4zM15 3a1 1 0 00-1 1v12a1 1 0 001 1h2a1 1 0 001-1V4a1 1 0 00-1-1h-2z" /></svg>,
          myRequests: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z" /><path fillRule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z" clipRule="evenodd" /></svg>,
          received: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M3 3a1 1 0 011-1h12a1 1 0 011 1v3a1 1 0 01-.293.707L12 11.414V15a1 1 0 01-1 1H9a1 1 0 01-1-1v-3.586L3.293 6.707A1 1 0 013 6V3z" clipRule="evenodd" /></svg>,
          admin: <svg className="h-5 w-5 mr-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fillRule="evenodd" d="M10 1.944A11.954 11.954 0 012.166 5c.066.02.13.04.195.061L3.98 6.556a.75.75 0 01.353.97l-1.12 2.375a.75.75 0 01-1.222.388l-.07-.07a11.954 11.954 0 010-3.328zM17.834 5a11.954 11.954 0 01-5.659-3.056l-1.12 2.375a.75.75 0 01-1.222-.388l-.07-.07a11.954 11.954 0 017.07 3.328z" clipRule="evenodd" /><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9 5a1 1 0 112 0v2a1 1 0 11-2 0V5z" clipRule="evenodd" /></svg>
        };
        
        const viewConfig = {
          dashboard: { label: "Dashboard", title: "DASHBOARD DE SOLICITAÇÕES", subtitle: currentUser.role === 'admin' ? 'Visão geral de todas as solicitações no sistema.' : 'Resumo das suas solicitações.', component: <Dashboard requests={requests} currentUser={currentUser} /> },
          travel: { label: "Solicitação de Viagem", title: "SISTEMA DE SOLICITAÇÕES", subtitle: "Preencha o formulário para solicitar uma viagem.", component: <TravelRequestForm onAddRequest={addRequest} /> },
          munck: { label: "Solicitação de Muncks", title: "SISTEMA DE SOLICITAÇÕES", subtitle: "Preencha o formulário para solicitar um Munck.", component: <MunckRequestForm onAddRequest={addRequest} /> },
          scaffold: { label: "Andaimes e Plataformas", title: "SISTEMA DE SOLICITAÇÕES", subtitle: "Preencha o formulário para solicitar andaimes ou plataformas.", component: <ScaffoldRequestForm onAddRequest={addRequest} /> },
          myRequests: { label: "Minhas Solicitações", title: "MINHAS SOLICITAÇÕES", subtitle: "Acompanhe o status de suas solicitações enviadas.", component: <MyRequests requests={requests} currentUser={currentUser} onShowDetails={handleShowDetails} /> },
          received: { label: "Solicitações Recebidas", title: "SOLICITAÇÕES RECEBIDAS", subtitle: "Visualize e gerencie todas as solicitações enviadas.", component: <ReceivedRequests requests={requests} onUpdateRequestStatus={updateRequestStatus} onShowDetails={handleShowDetails} onRemoveRequest={removeRequest} /> },
          admin: { label: "Painel Administrativo", title: "PAINEL ADMINISTRATIVO", subtitle: "Gerencie as configurações e usuários do sistema.", component: <AdminPanel requests={requests} users={users} onAddUser={addUser} onRemoveUser={removeUser} currentUser={currentUser} onReloadUsers={reloadUsers} /> }
        };

        const NavButton = ({ viewType, label, icon }) => (
          <button onClick={() => setActiveView(viewType)} className={`w-full flex items-center px-4 py-3 text-sm font-medium rounded-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-yellow-400 ${ activeView === viewType ? 'bg-yellow-400 text-gray-900 font-semibold' : 'text-gray-300 hover:bg-gray-700 hover:text-white' }`}>
            {icon}<span>{label}</span>
          </button>
        );

        const availableViews = currentUser.role === 'admin' 
            ? ['dashboard', 'travel', 'munck', 'scaffold', 'myRequests', 'received', 'admin'] 
            : ['travel', 'munck', 'scaffold', 'myRequests'];
        const currentView = viewConfig[activeView];

        return (
          <>
            <div className="flex h-screen bg-gray-50 font-sans overflow-hidden">
              <aside className="w-64 bg-gray-800 text-white flex flex-col flex-shrink-0">
                <div className="h-20 flex items-center justify-center px-4 bg-gray-900">
                  <img src="https://verticalparts.volpecom.net/_lib/img/grp__NM__bg__NM__logotipo_branco.png" alt="Logo" className="h-10 object-contain" />
                </div>
                <nav className="flex-1 px-2 py-4 space-y-2">
                  {availableViews.map(viewKey => (
                      viewConfig[viewKey] && <NavButton key={viewKey} viewType={viewKey} label={viewConfig[viewKey].label} icon={icons[viewKey]} />
                  ))}
                </nav>
                <div className="px-2 py-4 border-t border-gray-700">
                  <button onClick={handleLogout} className="w-full flex items-center justify-center px-4 py-3 text-sm font-medium rounded-md text-gray-300 hover:bg-red-600 hover:text-white transition-colors duration-200">
                    Sair
                  </button>
                </div>
              </aside>

              <main className="flex-1 overflow-y-auto">
                <div className="container mx-auto p-4 sm:p-6 lg:p-8">
                  <header className="text-center mb-8">
                    <h1 className="text-4xl font-bold text-gray-800">{currentView?.title}</h1>
                    <p className="text-gray-600 mt-2">{currentView?.subtitle}</p>
                  </header>

                  <div className="max-w-7xl mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div className="p-6 sm:p-8">
                       {loading ? (
                            <div className="text-center p-8"><p className="text-gray-600">Carregando dados...</p></div>
                        ) : error ? (
                            <div className="text-center p-8 text-red-600">
                                <p>Ocorreu um erro: {error}</p>
                                <button onClick={reloadAll} className="mt-4 px-4 py-2 bg-yellow-400 text-gray-900 rounded-md hover:bg-yellow-500">
                                    Tentar Novamente
                                </button>
                            </div>
                        ) : (
                            currentView?.component
                        )}
                    </div>
                  </div>

                  <footer className="text-center mt-12 text-gray-500 text-sm">
                    <p>© 2025 VerticalParts. Todos os direitos reservados.</p>
                  </footer>
                </div>
              </main>
            </div>
            {isModalOpen && selectedRequest && (<RequestDetailsModal request={selectedRequest} onClose={handleCloseDetails} onUpdateDetails={updateRequestDetails} />)}
          </>
        );
      };

      const rootElement = document.getElementById('root');
      if (!rootElement) throw new Error("Could not find root element to mount to");
      const root = ReactDOM.createRoot(rootElement);
      root.render(<React.StrictMode><App /></React.StrictMode>);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
