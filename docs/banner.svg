      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#141B33"/>
      <stop offset="1" stop-color="#2A1A4A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
