<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="1200" height="500" fill="#0B1220"/>
